[package]
name = "abcd-downloader"
version = "0.1.0"
edition = "2024"
description = "Rust library and CLI for downloading selected models from ABC: A Big CAD Dataset"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/abcd-downloader"
keywords = ["cad", "dataset", "abcd", "downloader"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "abcd-downloader"
path = "src/bin/abcd-downloader.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3.32"
md5 = "0.8.0"
reqwest = { version = "0.13.3", features = ["stream", "rustls"] }
serde_yaml = "0.9.34"
sevenz-rust2 = "0.21.0"
tokio = { version = "1.52.1", features = ["full"] }
zip = "8.6.0"
